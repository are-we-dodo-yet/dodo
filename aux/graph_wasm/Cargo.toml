[package]
name = "deno_graph_wasm"
version = "0.0.0"
edition = "2021"
homepage = "https://deno.land/"
repository = "https://github.com/denoland/deno_graph"
documentation = "https://docs.rs/deno_graph"
authors = ["the Deno authors"]
license = "MIT"

[lib]
name = "deno_graph_wasm"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
deno_graph = { workspace = true, features = ["swc"], default-features = false }

console_error_panic_hook = "0.1.7"
futures = "0.3.17"
js-sys.workspace = true
serde = { version = "1.0.130", features = ["derive", "rc"] }
serde_json = { version = "1.0.67", features = ["preserve_order"] }
serde-wasm-bindgen.workspace = true
sys_traits = { workspace = true, features = ["real", "wasm"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
thiserror.workspace = true
deno_error.workspace = true

[dev-dependencies]
pretty_assertions = "1.0.0"
