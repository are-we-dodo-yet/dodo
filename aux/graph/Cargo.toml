[package]
name = "deno_graph"
version = "0.111.0"
authors = ["the Deno authors"]
documentation = "https://docs.rs/deno_graph"
edition = "2024"
homepage = "https://deno.land/"
license = "MIT"
repository = "https://github.com/denoland/deno_graph"
description = "Module graph analysis for deno"

[lib]
name = "deno_graph"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["fast_check", "ecosystem_test"]
fast_check = ["symbols", "deno_ast/transpiling", "twox-hash"]
symbols = ["swc", "deno_ast/transforms", "deno_ast/utils"]
swc = ["deno_ast", "deno_ast/visit"]
ecosystem_test = []

[[test]]
name = "specs"
path = "tests/specs_test.rs"
harness = false

[[test]]
name = "ecosystem"
path = "tests/ecosystem_test.rs"
harness = false

[dependencies]
# this is optional in order to support using parsers other than swc
deno_ast = { workspace = true, features = ["emit"], optional = true }
deno_error.workspace = true
deno_media_type = { workspace = true, features = [
  "decoding",
  "data_url",
  "module_specifier",
] }
deno_path_util.workspace = true
deno_semver.workspace = true
deno_unsync.workspace = true
async-trait.workspace = true
boxed_error.workspace = true
capacity_builder.workspace = true
chrono = { workspace = true, features = ["serde"] }
data-url.workspace = true
futures.workspace = true
indexmap = { workspace = true, features = ["serde"] }
log.workspace = true
monch.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
sys_traits.workspace = true
thiserror.workspace = true
twox-hash = { workspace = true, optional = true }
url = { workspace = true, features = ["serde"] }
wasm_dep_analyzer.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
deno_unsync = { workspace = true, features = ["tokio"] }

[dev-dependencies]
bincode.workspace = true
deno_terminal.workspace = true
env_logger.workspace = true
file_test_runner.workspace = true
pretty_assertions.workspace = true
reqwest = { workspace = true, features = ["http2", "charset", "rustls-tls-webpki-roots"] }
sys_traits = { workspace = true, features = ["memory"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
