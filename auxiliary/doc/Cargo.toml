[package]
name = "deno_doc"
version = "0.209.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/denoland/deno_doc"
description = "doc generation for deno"

[lib]
name = "deno_doc"

[[example]]
name = "ddoc"
required-features = ["comrak"]

[dependencies]
anyhow.workspace = true
cfg-if.workspace = true
comrak = { workspace = true, optional = true }
deno_ast.workspace = true
deno_graph = { workspace = true, features = ["symbols"] }
deno_path_util.workspace = true
deno_terminal.workspace = true
handlebars = { workspace = true, features = ["string_helpers"] }
html-escape.workspace = true
indexmap.workspace = true
itoa.workspace = true
lazy_static.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
termcolor.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
console_static_text.workspace = true
criterion = { workspace = true, features = ["async_futures", "html_reports"] }
file_test_runner.workspace = true
futures.workspace = true
html5ever.workspace = true
insta = { workspace = true, features = ["json"] }
markup5ever_rcdom.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["full"] }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
url = "2.4.1"
percent-encoding = "2.3.1"
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true

[features]
default = ["rust", "comrak"]
rust = []

[[test]]
name = "specs"
path = "tests/specs_test.rs"
harness = false

[[test]]
name = "diff_specs"
path = "tests/diff_specs_test.rs"
harness = false
