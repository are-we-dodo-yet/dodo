[package]
name = "deno_node_crypto"
version = "0.29.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node crypto compatibility for Deno"

[lib]
path = "lib.rs"

[dependencies]
aes.workspace = true
aws-lc-rs.workspace = true
aws-lc-sys.workspace = true
base64.workspace = true
blake2.workspace = true
cbc.workspace = true
const-oid.workspace = true
crypto-bigint = { workspace = true, features = ["alloc", "rand_core"] }
crypto-primes.workspace = true
ctr.workspace = true
data-encoding.workspace = true
deno_core.workspace = true
deno_crypto_provider.workspace = true
deno_error.workspace = true
der = { workspace = true, features = ["derive"] }
des.workspace = true
digest = { workspace = true, features = ["block-api", "alloc"] }
dsa = { workspace = true, features = ["hazmat"] }
ecb.workspace = true
ecdsa.workspace = true
ed25519-dalek = { workspace = true, features = ["digest", "pkcs8", "rand_core"] }
ed448-goldilocks = { workspace = true }
elliptic-curve.workspace = true
faster-hex.workspace = true
ghash.workspace = true
hkdf.workspace = true
hmac.workspace = true
k256.workspace = true
md-5 = { workspace = true, features = ["oid"] }
md4.workspace = true
num-bigint = { workspace = true, features = ["rand_core_0_10"] }
num-integer.workspace = true
num-traits.workspace = true
p224.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
pbkdf2.workspace = true
pkcs12.workspace = true
pkcs8 = { workspace = true, features = ["std", "encryption"] }
rand.workspace = true
rc2.workspace = true
ripemd = { workspace = true, features = ["oid"] }
rsa.workspace = true
sec1.workspace = true
serde.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3 = { workspace = true, features = ["oid"] }
shake.workspace = true
sm3.workspace = true
spki.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
x509-parser.workspace = true
yoke.workspace = true
