[package]
name = "eszip"
version = "0.137.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A utility that can download JavaScript and TypeScript module graphs and store them locally in a special zip file"

[lib]
path = "lib.rs"

[[example]]
name = "eszip_builder"
path = "examples/builder.rs"

[[example]]
name = "eszip_viewer"
path = "examples/viewer.rs"

[features]
xxhash3 = ["xxhash-rust/xxh3"]
sha256 = ["dep:sha2"]
# backwards compatibility. Disabling sha256 will break compatibility with eszips older than v2.2
default = ["sha256"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
deno_ast = { workspace = true, features = ["transpiling"] }
deno_error.workspace = true
deno_graph = { workspace = true, default-features = false, features = ["swc"] }
deno_npm.workspace = true
deno_semver.workspace = true
futures.workspace = true
hashlink.workspace = true
import_map.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
url.workspace = true
xxhash-rust = { workspace = true, optional = true }

[dev-dependencies]
import_map.workspace = true
insta.workspace = true
jsonc-parser.workspace = true
pretty_assertions.workspace = true
reqwest = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["macros", "rt"] }
